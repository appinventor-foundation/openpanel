{{- if .Values.api.enabled }}
{{- $clickhouseHost := ternary .Values.clickhouse.service.name .Values.externalClickhouse.host .Values.clickhouse.enabled }}
{{- $clickhousePort := ternary .Values.clickhouse.service.httpPort .Values.externalClickhouse.port .Values.clickhouse.enabled }}
{{- $clickhouseDatabase := ternary .Values.clickhouse.database .Values.externalClickhouse.database .Values.clickhouse.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: openpanel-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    app: openpanel
    component: migrations
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
spec:
  template:
    metadata:
      labels:
        app: openpanel
        component: migrations
    spec:
{{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml .Values.global.imagePullSecrets | indent 8 }}
{{- end }}
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: {{ if .Values.global.registry }}{{ .Values.global.registry }}/{{ end }}{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}
          command:
            - sh
            - -c
            - |
              curl -fsS "http://{{ $clickhouseHost }}:{{ $clickhousePort }}/" \
                --data-binary "CREATE DATABASE IF NOT EXISTS {{ $clickhouseDatabase }}{{- if eq (toString .Values.config.clickhouseCluster) "true" }} ON CLUSTER '{cluster}'{{- end }}"

              echo 'Running migrations...'
              CI=true pnpm -r run migrate:deploy
          env:
            - name: NODE_ENV
              value: {{ .Values.config.nodeEnv | quote }}
            - name: SELF_HOSTED
              value: {{ .Values.config.selfHosted | quote }}
            - name: DATABASE_URL
{{- if and (not .Values.postgresql.enabled) .Values.externalPostgresql.existingSecret.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalPostgresql.existingSecret.name }}
                  key: {{ .Values.externalPostgresql.existingSecret.uriKey }}
{{- else if .Values.postgresql.enabled }}
              value: "postgresql://{{ .Values.postgresql.user }}:{{ .Values.postgresql.password }}@{{ .Values.postgresql.service.name }}:{{ .Values.postgresql.service.port }}/{{ .Values.postgresql.database }}?schema=public"
{{- else }}
              value: "postgresql://{{ .Values.externalPostgresql.user }}:{{ .Values.externalPostgresql.password }}@{{ .Values.externalPostgresql.host }}:{{ .Values.externalPostgresql.port }}/{{ .Values.externalPostgresql.database }}?schema={{ .Values.externalPostgresql.schema }}"
{{- end }}
            - name: DATABASE_URL_DIRECT
{{- if and (not .Values.postgresql.enabled) .Values.externalPostgresql.existingSecret.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalPostgresql.existingSecret.name }}
                  key: {{ .Values.externalPostgresql.existingSecret.uriKey }}
{{- else if .Values.postgresql.enabled }}
              value: "postgresql://{{ .Values.postgresql.user }}:{{ .Values.postgresql.password }}@{{ .Values.postgresql.service.name }}:{{ .Values.postgresql.service.port }}/{{ .Values.postgresql.database }}?schema=public"
{{- else }}
              value: "postgresql://{{ .Values.externalPostgresql.user }}:{{ .Values.externalPostgresql.password }}@{{ .Values.externalPostgresql.host }}:{{ .Values.externalPostgresql.port }}/{{ .Values.externalPostgresql.database }}?schema={{ .Values.externalPostgresql.schema }}"
{{- end }}
            - name: REDIS_URL
{{- if .Values.redis.enabled }}
              value: "redis://{{ .Values.redis.service.name }}:{{ .Values.redis.service.port }}"
{{- else }}
              value: "redis://{{ .Values.externalRedis.host }}:{{ .Values.externalRedis.port }}"
{{- end }}
            - name: CLICKHOUSE_URL
{{- if .Values.clickhouse.enabled }}
              value: "http://{{ .Values.clickhouse.service.name }}:{{ .Values.clickhouse.service.httpPort }}/{{ .Values.clickhouse.database }}"
{{- else }}
              value: "http://{{ .Values.externalClickhouse.host }}:{{ .Values.externalClickhouse.port }}/{{ .Values.externalClickhouse.database }}"
{{- end }}
            - name: CLICKHOUSE_CLUSTER
              value: {{ .Values.config.clickhouseCluster | quote }}
      initContainers:
        - name: wait-for-databases
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              # Wait for Redis
{{- if .Values.redis.enabled }}
              until nc -z {{ .Values.redis.service.name }} {{ .Values.redis.service.port }}; do
{{- else }}
              until nc -z {{ .Values.externalRedis.host }} {{ .Values.externalRedis.port }}; do
{{- end }}
                echo "Waiting for Redis..."
                sleep 2
              done
              # Wait for ClickHouse
              until wget -q -O- http://{{ $clickhouseHost }}:{{ $clickhousePort }}/ping; do
                echo "Waiting for ClickHouse..."
                sleep 2
              done
              echo "All databases are ready!"
              # Note: PostgreSQL connection will be validated by the app
{{- end }}
