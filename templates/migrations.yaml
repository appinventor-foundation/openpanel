{{- if .Values.api.enabled }}
{{- $clickhouseHost := ternary .Values.clickhouse.service.name .Values.externalClickhouse.host .Values.clickhouse.enabled }}
{{- $clickhousePort := ternary .Values.clickhouse.service.httpPort .Values.externalClickhouse.port .Values.clickhouse.enabled }}
{{- $clickhouseDatabase := ternary .Values.clickhouse.database .Values.externalClickhouse.database .Values.clickhouse.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: openpanel-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    app: openpanel
    component: migrations
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
spec:
  template:
    metadata:
      labels:
        app: openpanel
        component: migrations
    spec:
{{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml .Values.global.imagePullSecrets | indent 8 }}
{{- end }}
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: {{ if .Values.global.registry }}{{ .Values.global.registry }}/{{ end }}{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}
          command:
            - sh
            - -c
            - |
              curl -fsS "http://{{ $clickhouseHost }}:{{ $clickhousePort }}/" \
                --data-binary "CREATE DATABASE IF NOT EXISTS {{ $clickhouseDatabase }}{{- if eq (toString .Values.config.clickhouseCluster) "true" }} ON CLUSTER '{cluster}'{{- end }}"

              echo 'Running migrations...'
              CI=true pnpm -r run migrate:deploy
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: openpanel-config
                  key: NODE_ENV
            - name: SELF_HOSTED
              valueFrom:
                configMapKeyRef:
                  name: openpanel-config
                  key: SELF_HOSTED
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
{{- if and (not .Values.postgresql.enabled) .Values.externalPostgresql.existingSecret.name }}
                  name: {{ .Values.externalPostgresql.existingSecret.name }}
                  key: {{ .Values.externalPostgresql.existingSecret.uriKey }}
{{- else }}
                  name: openpanel-secrets
                  key: DATABASE_URL
{{- end }}
            - name: DATABASE_URL_DIRECT
              valueFrom:
                secretKeyRef:
{{- if and (not .Values.postgresql.enabled) .Values.externalPostgresql.existingSecret.name }}
                  name: {{ .Values.externalPostgresql.existingSecret.name }}
                  key: {{ .Values.externalPostgresql.existingSecret.uriKey }}
{{- else }}
                  name: openpanel-secrets
                  key: DATABASE_URL_DIRECT
{{- end }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: openpanel-secrets
                  key: REDIS_URL
            - name: CLICKHOUSE_URL
              valueFrom:
                secretKeyRef:
                  name: openpanel-secrets
                  key: CLICKHOUSE_URL
            - name: CLICKHOUSE_CLUSTER
              valueFrom:
                configMapKeyRef:
                  name: openpanel-config
                  key: CLICKHOUSE_CLUSTER
      initContainers:
        - name: wait-for-databases
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              # Wait for Redis
{{- if .Values.redis.enabled }}
              until nc -z {{ .Values.redis.service.name }} {{ .Values.redis.service.port }}; do
{{- else }}
              until nc -z {{ .Values.externalRedis.host }} {{ .Values.externalRedis.port }}; do
{{- end }}
                echo "Waiting for Redis..."
                sleep 2
              done
              # Wait for ClickHouse
              until wget -q -O- http://{{ $clickhouseHost }}:{{ $clickhousePort }}/ping; do
                echo "Waiting for ClickHouse..."
                sleep 2
              done
              echo "All databases are ready!"
              # Note: PostgreSQL connection will be validated by the app
{{- end }}
